name: Build Android APK

# بيبني ملف APK للتجربة على سيرفر GitHub (من غير ما تسطّب حاجة عندك)
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saraati-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build debug APK
        run: npm run apk

      - uses: actions/upload-artifact@v4
        with:
          name: saraati-debug-apk
          path: saraati-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # بينشر الـ APK كـ Release عشان تحمّله مباشرة من الموبايل (من غير ZIP)
      - name: Publish release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest saraati-android/android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Latest build" --notes "Debug APK for testing" --target "${{ github.sha }}"
