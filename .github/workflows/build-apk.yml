name: Build Android APK

# بيبني ملف APK للتجربة على سيرفر GitHub (من غير ما تسطّب حاجة عندك)
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saraati-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build debug APK
        run: npm run apk

      - uses: actions/upload-artifact@v4
        with:
          name: saraati-debug-apk
          path: saraati-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
